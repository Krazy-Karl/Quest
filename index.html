<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Grimoire de Campagne</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IM+Fell+English:ital@0;1&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Concept : interface de jeu de rôle médiéval. Panneaux sombres cerclés d'or, bannières rouges, tuiles d'objets, dés polyédriques. Look sombre assumé (un seul thème). */
:root{
  --bg:#0d0905; --panel:#17100a; --paper:#17100a; --paper2:#241a10; --ink:#e8d9b5; --ink2:#a08a62; --line:#5a4322;
  --gold:#d6a93b; --gold-d:#8c6a26; --seal:#b3342c; --seal-d:#5a1410; --good:#6fae5f; --bad:#e2584d;
  --display:'Cinzel','Times New Roman',serif; --name:'IM Fell English',Georgia,serif; --sc:'Cinzel','Times New Roman',serif; --body:'Crimson Pro',Georgia,serif;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8  0 0 0 0 .6  0 0 0 0 .3  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg) radial-gradient(ellipse at 50% -10%,#3a2512 0,transparent 60%);color:var(--ink);font-family:var(--body);font-size:var(--fs,17px);line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto}
header{padding:14px 0 6px}
header .in{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
h1{font:700 24px/1.1 var(--display);margin:0;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-shadow:0 2px 0 #000,0 0 18px rgba(214,169,59,.3)}
.sub{font:italic 15px var(--body);color:var(--ink2);margin:3px 0 0}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav button{font:600 13px var(--sc);letter-spacing:.09em;text-transform:uppercase;color:var(--ink);cursor:pointer;
  background:linear-gradient(#7a1f1a,#3d0e0b);border:2px solid var(--gold-d);border-radius:4px;padding:8px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 8px rgba(0,0,0,.5)}
nav button:hover{border-color:var(--gold);filter:brightness(1.15)}
nav button[aria-selected="true"]{background:linear-gradient(#b3342c,#6a1713);border-color:var(--gold);color:#fff3dc;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 14px rgba(214,169,59,.35)}
nav button[data-fs]{background:transparent;border-color:var(--line);padding:6px 9px;letter-spacing:0;box-shadow:none;color:var(--ink2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{margin-top:14px}
section[hidden]{display:none}
.frame{position:relative;background:var(--panel) var(--noise);border:2px solid var(--gold-d);border-radius:3px;
  box-shadow:inset 0 0 0 2px #0a0603,inset 0 0 0 3px var(--line),0 10px 30px rgba(0,0,0,.6)}
.frame::before{content:"";position:absolute;inset:-5px;pointer-events:none;
  background:linear-gradient(var(--gold),var(--gold)) 0 0/16px 3px,linear-gradient(var(--gold),var(--gold)) 0 0/3px 16px,
   linear-gradient(var(--gold),var(--gold)) 100% 0/16px 3px,linear-gradient(var(--gold),var(--gold)) 100% 0/3px 16px,
   linear-gradient(var(--gold),var(--gold)) 0 100%/16px 3px,linear-gradient(var(--gold),var(--gold)) 0 100%/3px 16px,
   linear-gradient(var(--gold),var(--gold)) 100% 100%/16px 3px,linear-gradient(var(--gold),var(--gold)) 100% 100%/3px 16px;
  background-repeat:no-repeat}
.sec{padding:20px}
h2{font:700 22px var(--display);letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px;color:var(--gold)}
h3{font:600 14px var(--sc);letter-spacing:.14em;text-transform:uppercase;margin:16px 0 8px;color:var(--gold);display:flex;align-items:center;gap:10px}
h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-d),transparent)}
label{font:600 11px var(--sc);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);display:block}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{background:#0e0905;border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%;min-width:0;box-shadow:inset 0 1px 4px rgba(0,0,0,.6)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{resize:vertical;min-height:70px}
select option{background:#1a120b;color:var(--ink)}
button.b{background:linear-gradient(#b3342c,#6a1713);color:#fff3dc;border:2px solid var(--gold-d);border-radius:4px;padding:7px 16px;cursor:pointer;font:600 13px var(--sc);letter-spacing:.1em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
button.b:hover{border-color:var(--gold);filter:brightness(1.15)}
button.b:disabled{opacity:.45;cursor:default;filter:none}
button.g{background:#1c130b;border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer;color:var(--ink)}
button.g:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
button.g:disabled{opacity:.4;cursor:default}
button.x{background:none;border:0;color:var(--ink2);cursor:pointer;padding:2px 6px}
button.x:hover{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
.grow{flex:1 1 160px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{border:1px solid var(--line);background:linear-gradient(160deg,#2a1e12,#170f09);padding:10px 12px;border-radius:3px;box-shadow:inset 0 0 0 1px #0a0603}
.muted{color:var(--ink2)} .small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font:600 11px var(--sc);letter-spacing:.08em;border:1px solid var(--gold-d);padding:1px 8px;border-radius:10px;color:var(--gold);background:#1a1109}
.scroll{overflow-x:auto}
.note{border:1px dashed var(--line);padding:10px 12px;color:var(--ink2);font-style:italic}
.sr{position:absolute;left:-9999px}
code{font:13px ui-monospace,monospace;color:var(--gold)}
details summary{cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(#2a1d10,#150e08);color:var(--ink);border:2px solid var(--gold-d);padding:8px 18px;border-radius:4px;z-index:40;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.7)}
/* ----- écran de jeu ----- */
.game{display:grid;grid-template-columns:minmax(350px,5fr) 6fr;gap:20px;height:calc(100dvh - 130px);min-height:580px}
.game>.frame{min-height:0;display:flex}
.pane{flex:1;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 16px;scrollbar-color:var(--gold-d) transparent}
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.chat .log{flex:1;max-height:none;min-height:0}
.chat .row.small .g{padding:4px 8px;font-size:14px}
.hud{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.portrait{position:relative;flex:none;width:62px;height:62px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(circle at 35% 30%,#4d3721,#1a110a);display:grid;place-items:center;font:700 28px var(--sc);color:var(--gold);box-shadow:0 0 0 2px #0a0603,0 0 16px rgba(214,169,59,.25)}
.portrait .lv{position:absolute;right:-8px;bottom:-4px;background:var(--seal);color:#fff3dc;border:2px solid var(--gold);border-radius:10px;font:600 10px var(--sc);padding:0 6px;letter-spacing:.04em}
.title{font:400 26px var(--name);color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--line);box-shadow:none;padding:2px 0;width:100%}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:8px 0}
.picks input{margin-top:4px}
.hp{position:relative;height:24px;border:2px solid var(--gold-d);background:#1b0907;border-radius:3px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#e24b3f,#8e1f19);box-shadow:inset 0 2px 0 rgba(255,255,255,.22);transition:width .4s}
.hp b{position:relative;display:block;text-align:center;font:600 13px/20px var(--sc);letter-spacing:.08em;color:#fff3dc;text-shadow:0 1px 2px #000}
.hp.low{border-color:var(--bad)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:10px}
.res label{display:flex;align-items:center;gap:4px}
.res svg.coin{width:14px;height:14px;fill:none;stroke:var(--gold);stroke-width:1.6}
.stepper{display:flex;align-items:center;gap:5px}
.stepper input{width:100%;text-align:center;padding:4px}
.stepper .g{padding:3px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chip{font:14px var(--body);border:1px solid var(--line);background:#1c130b;border-radius:14px;padding:3px 11px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip.on{background:linear-gradient(#b3342c,#6a1713);color:#fff3dc;border-color:var(--gold)}
.chips .chip[data-sugg]::before{content:"▸ ";color:var(--gold)}
.stats5{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mana{position:relative;height:16px;margin-top:5px;border:2px solid #2d4f86;background:#0b1424;border-radius:3px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
.mana i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#4d8be0,#264f93);box-shadow:inset 0 2px 0 rgba(255,255,255,.2);transition:width .4s}
.mana b{position:relative;display:block;text-align:center;font:600 11px/12px var(--sc);letter-spacing:.08em;color:#e8f0ff;text-shadow:0 1px 2px #000}
.st{border:2px solid var(--line);background:linear-gradient(160deg,#2f2214,#150e08);border-radius:4px 4px 14px 14px;padding:5px 2px 3px;text-align:center;min-width:0}
.st label{font-size:10px;letter-spacing:.05em}
.st input{text-align:center;font:700 22px var(--sc);padding:0;border:0;background:transparent;width:100%;box-shadow:none;color:var(--gold)}
.st button{font:600 12px var(--sc);color:#fff3dc;background:linear-gradient(#b3342c,#6a1713);border:1px solid var(--gold-d);border-radius:9px;cursor:pointer;padding:1px 6px;margin-top:2px}
.st button:hover{border-color:var(--gold)}
.doll{display:grid;grid-template-columns:58px 1fr 58px;gap:8px;align-items:start}
.col{display:flex;flex-direction:column;gap:6px}
.fig{align-self:stretch;display:flex;justify-content:center;min-height:240px}
.fig svg{height:100%;max-height:250px;width:auto;max-width:100%}
.feet{display:flex;justify-content:center;gap:8px;margin-top:8px}
.sl{position:relative;flex:none;width:58px;height:58px;border:2px solid var(--line);border-radius:4px;background:linear-gradient(160deg,#2f2214,#150e08);color:#6f5a38;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:inset 0 0 0 1px #0a0603}
.sl:hover{border-color:var(--gold)}
.sl.on{border-color:var(--gold);color:var(--gold);box-shadow:inset 0 0 12px rgba(214,169,59,.28),inset 0 0 0 1px #0a0603}
.sl svg,.it svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sl svg{width:28px;height:28px}
.sl small{font:600 8px/1 var(--sc);letter-spacing:.03em;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;box-shadow:none}
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.it{position:relative;aspect-ratio:1;border:2px solid var(--line);border-radius:4px;background:linear-gradient(160deg,#2f2214,#150e08);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px #0a0603}
.it:hover{border-color:var(--gold-d)}
.it.sel{border-color:var(--gold);box-shadow:0 0 10px rgba(214,169,59,.35),inset 0 0 0 1px #0a0603}
.it.empty{opacity:.35;cursor:default;border-style:dashed}
.it svg{width:58%;height:58%}
.it .q{position:absolute;right:3px;bottom:1px;font:700 11px var(--sc);color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
.itd{display:flex;gap:8px;align-items:center;margin-top:8px;padding:6px 8px;border:1px solid var(--line);background:#120b06;border-radius:3px}
.itd svg{width:28px;height:28px;flex:none;color:var(--gold);fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.itd input[type=number]{width:62px}
/* ----- chat ----- */
.log{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto;padding:10px;background:rgba(0,0,0,.32);border:1px solid #2a1d0f;box-shadow:inset 0 0 20px rgba(0,0,0,.65);margin-bottom:10px;scrollbar-color:var(--gold-d) transparent}
.msg{padding:6px 12px;border-left:3px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.msg .who{font:600 11px var(--sc);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);display:block;margin-bottom:1px}
.msg.mj{border-color:var(--gold);background:linear-gradient(90deg,rgba(214,169,59,.12),transparent 85%);font-size:1.04em}
.msg.mj .who{color:var(--gold)}
.msg.roll{border-color:var(--seal);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg.roll .who{margin:0}
.msg.roll .rt{font:600 15px var(--sc);color:var(--ink)}
.msg.roll.crit{border-color:var(--good);background:linear-gradient(90deg,rgba(111,174,95,.18),transparent 85%)}
.msg.roll.crit .rt{color:var(--good)}
.msg.roll.fumble{border-color:var(--bad);background:linear-gradient(90deg,rgba(226,88,77,.16),transparent 85%)}
.msg.roll.fumble .rt{color:var(--bad)}
.msg.sys{border-color:transparent;color:var(--gold-d);font-style:italic;font-size:15px;padding-block:1px}
.msg.sys::before{content:"✦ ";font-style:normal}
.msg.ooc{border-color:transparent;color:var(--ink2);font-size:.92em;font-style:italic}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 0 12px}
.hint{font-size:12.5px;color:var(--ink2);margin:3px 0 0}
.dicebar{display:flex;gap:4px 6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.die{position:relative;width:44px;height:44px;background:none;border:0;padding:0;cursor:pointer;color:var(--gold)}
.die svg{width:100%;height:100%;fill:#1d140c;stroke:currentColor;stroke-width:1.2;stroke-linejoin:round;transition:transform .15s,fill .15s}
.die span{position:absolute;inset:0;display:grid;place-items:center;font:700 11px var(--sc);color:var(--ink);pointer-events:none}
.die:hover svg{transform:rotate(14deg) scale(1.1);fill:#43160f}
.dicebar input{width:84px;padding:4px 6px}
.rico{width:22px;height:22px;flex:none;fill:#1d140c;stroke:var(--gold);stroke-width:1.4;stroke-linejoin:round}
.fx{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;width:150px;height:150px;display:grid;place-items:center;opacity:0;transition:opacity .3s}
.fx.show{opacity:1}
.fx svg{position:absolute;inset:0;width:100%;height:100%;fill:#1d140c;stroke:var(--gold);stroke-width:1.2;stroke-linejoin:round;filter:drop-shadow(0 0 18px rgba(214,169,59,.55))}
.fx b{position:relative;font:700 52px var(--sc);color:var(--ink);text-shadow:0 2px 0 #000}
.fx small{position:absolute;bottom:-28px;font:600 13px var(--sc);letter-spacing:.1em;color:var(--ink2);white-space:nowrap;text-shadow:0 1px 3px #000}
.fx.crit svg{stroke:var(--good);filter:drop-shadow(0 0 20px rgba(111,174,95,.7))}
.fx.fumble svg{stroke:var(--bad);filter:drop-shadow(0 0 20px rgba(226,88,77,.7))}
.hsel{width:auto;max-width:62vw;padding:1px 6px;font:italic 15px var(--body);display:inline-block;vertical-align:baseline}
.mini{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--gold-d);background:radial-gradient(circle at 35% 30%,#4d3721,#1a110a);font:700 13px var(--sc);color:var(--gold)}
.minis{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;min-height:28px;align-items:center}
.cname{font:400 20px var(--name);color:var(--ink)}
.camp.cur{border-color:var(--gold);box-shadow:0 0 12px rgba(214,169,59,.25),inset 0 0 0 1px #0a0603}
.portrait.small{width:44px;height:44px;font-size:20px}
label.chip{font:14px var(--body);text-transform:none;letter-spacing:0;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
label.chip input{width:auto;box-shadow:none}
.atks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.atk{position:relative;display:grid;grid-template-columns:28px 1fr;grid-template-areas:"i n" "i b";gap:0 8px;align-items:center;text-align:left;padding:6px 8px;border:2px solid #5a2a20;border-radius:4px;background:linear-gradient(160deg,#3a1a14,#1a0d09);cursor:pointer;color:var(--ink);box-shadow:inset 0 0 0 1px #0a0603}
.atk:hover{border-color:var(--gold)}
.atk.off{opacity:.45}
.atk .ai{grid-area:i;color:var(--gold)}
.atk .ai svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.atk .an{grid-area:n;font:600 13px var(--sc);letter-spacing:.04em;padding-right:34px}
.atk .ab{grid-area:b;font-size:13px;color:var(--ink2)}
.atk .ap{position:absolute;right:6px;top:4px;font:600 10px var(--sc);color:#8fb4f0}
.advs{display:flex;gap:6px;margin-bottom:8px}.advs .g{flex:1}.advs .g.on{border-color:var(--gold);color:var(--gold)}
.aed{margin-top:8px;border:1px solid var(--line);padding:8px;background:#120b06;border-radius:3px}
.aer{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line);align-items:center}
.aer .ae{flex:1 1 56px;padding:3px 4px;font-size:13px;min-width:0}
.aer input[data-k=nom]{flex:1 1 60%}
.combat{border:1px solid var(--gold-d);background:linear-gradient(#1f120c,#150d08);padding:8px 10px;margin-bottom:10px;max-height:250px;overflow-y:auto;border-radius:3px;scrollbar-color:var(--gold-d) transparent}
.cb{font:700 13px var(--sc);letter-spacing:.14em;text-transform:uppercase;color:#e0584f}
.foes{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px}
.fh .tag{white-space:nowrap;flex:none}
.foe{border:2px solid var(--line);padding:6px 8px;background:#120b06;border-radius:3px;min-width:0}
.foe.tgt{border-color:var(--gold);box-shadow:0 0 10px rgba(214,169,59,.3)}.foe.ko{opacity:.45}
.fh{display:flex;justify-content:space-between;gap:6px;align-items:baseline}.fh strong{font:400 17px var(--name);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar{position:relative;height:14px;margin:4px 0;border:1px solid #5a1f1a;background:#1b0907;border-radius:2px;overflow:hidden}
.fbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#d9473b,#8e1f19);transition:width .4s}
.fbar b{position:relative;display:block;text-align:center;font:600 10px/12px var(--sc);color:#fff3dc;text-shadow:0 1px 2px #000}
.fa{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.fa .g.on{border-color:var(--gold);color:var(--gold)}
.ini{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;padding:6px 8px;background:#0f0905;border:1px solid var(--line);border-radius:3px}
.rnd{font:700 11px var(--sc);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-right:4px}
.ic{font-size:13px;padding:2px 9px;border:1px solid var(--line);border-radius:12px;color:var(--ink2);white-space:nowrap}.ic b{color:var(--ink);font-family:var(--sc)}
.ic.pj{border-color:#3d6a8a}.ic.enemy{border-color:#7a2b25}
.ic.on{background:linear-gradient(#7a5a1a,#3a2a0a);border-color:var(--gold);color:#fff3dc;box-shadow:0 0 10px rgba(214,169,59,.5)}
.ic.ko{text-decoration:line-through;opacity:.45}
.cbt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.foe{display:flex;gap:8px;align-items:flex-start}.foe .fb{flex:1;min-width:0}
.foe.act{border-color:#e0584f;box-shadow:0 0 12px rgba(226,88,79,.5)}

(function(){

 Soldat:'Soldier',Érudit:'Scholar',Criminel:'Criminal',Marchand:'Merchant',Ermite:'Hermit',Voyageur:'Wanderer',Marin:'Sailor',Paysan:'Peasant',Chasseur:'Hunter'};
/* w = poids des caractéristiques (str, dex, con, int, wis, cha) ; hd = dé de vie ; ac = bonus d'armure ; pm = mana de base, cast = stat d'incantation */
const CLASS_DEF={
 warrior:{w:{str:4,con:3,dex:2.5,wis:1.5,cha:1,int:.5},hd:10,ac:3,pm:0,al:['warrior','guerrier','fighter']},
 barbarian:{w:{str:4,con:3.5,dex:2,wis:1.5,cha:.5,int:0},hd:12,ac:2,pm:0,al:['barbarian','barbare']},
 paladin:{w:{str:3.5,cha:3.5,con:2.5,wis:1.5,dex:1,int:.5},hd:10,ac:3,pm:4,cast:'cha',al:['paladin']},
 ranger:{w:{dex:4,wis:3,con:2.5,str:2,int:1,cha:.5},hd:8,ac:2,pm:4,cast:'wis',al:['ranger','rodeur']},
 rogue:{w:{dex:4,cha:2.5,int:2.5,wis:1.5,con:1,str:.5},hd:8,ac:1,pm:0,al:['rogue','voleur','thief']},
 bard:{w:{cha:4,dex:2.5,int:2,wis:1.5,con:1.5,str:.5},hd:8,ac:1,pm:8,cast:'cha',al:['bard','barde']},
 mage:{w:{int:4,con:2.5,dex:2.5,wis:2,cha:1,str:0},hd:6,ac:0,pm:10,cast:'int',al:['mage','magicien','wizard']},
 sorcerer:{w:{cha:4,con:3,dex:2,int:1.5,wis:1,str:.5},hd:6,ac:0,pm:10,cast:'cha',al:['sorcerer','ensorceleur']},
 warlock:{w:{cha:4,con:2.5,int:2.5,dex:1.5,wis:1,str:.5},hd:8,ac:1,pm:8,cast:'cha',al:['warlock','occultiste']},
 cleric:{w:{wis:4,con:2.5,str:2,cha:2,int:1,dex:.5},hd:8,ac:2,pm:8,cast:'wis',al:['cleric','clerc','priest']},
 druid:{w:{wis:4,con:2.5,int:2.5,dex:1.5,cha:.5,str:.5},hd:8,ac:1,pm:8,cast:'wis',al:['druid','druide']},
 monk:{w:{dex:4,wis:3,con:2.5,str:2,int:.5,cha:.5},hd:8,ac:1,pm:4,cast:'wis',al:['monk','moine']},
 alchemist:{w:{int:4,dex:2.5,con:2.5,wis:1.5,cha:.5,str:.5},hd:8,ac:0,pm:6,cast:'int',al:['alchemist','alchimiste']}};
/* bonus de race inspirés des règles SRD de D&D 5e ; r = nombre de +1 répartis au hasard */
const RACE_DEF={
 human:{b:{str:1,dex:1,con:1,int:1,wis:1,cha:1},al:['human','humain']},elf:{b:{dex:2,int:1},al:['elf','elfe']},dwarf:{b:{con:2,wis:1},al:['dwarf','nain']},
 halfling:{b:{dex:2,cha:1},al:['halfling','halfelin']},gnome:{b:{int:2,con:1},al:['gnome']},'half-elf':{b:{cha:2},r:2,al:['half-elf','demi-elfe']},
 'half-orc':{b:{str:2,con:1},al:['half-orc','demi-orc']},dragonkin:{b:{str:2,cha:1},al:['dragonkin','drakeide']},catfolk:{b:{dex:2,cha:1},al:['catfolk','felin']},sylvan:{b:{wis:2,dex:1},al:['sylvan','sylvain']}};
const plain=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const findDef=(defs,name)=>{const n=plain(name);return Object.values(defs).find(d=>d.al.includes(n))||null};
const DEF_CLASS={w:{str:2,dex:2,con:2,int:2,wis:2,cha:2},hd:8,ac:1,pm:0};
function genStats(race,classe){
  const C=findDef(CLASS_DEF,classe)||DEF_CLASS,R=findDef(RACE_DEF,race)||{b:{},r:2};
  const keys=STATS.map(x=>x[0]);
  const rolls=keys.map(()=>{const d=[0,0,0,0].map(()=>1+Math.floor(Math.random()*6)).sort((a,b)=>a-b);return d[1]+d[2]+d[3]}).sort((a,b)=>b-a);   // 4d6, on retire le plus bas
  const order=keys.map(k=>({k,v:(C.w[k]??2)+(Math.random()*2.4-1.2)})).sort((a,b)=>b.v-a.v).map(x=>x.k);                                    // la classe oriente, le hasard nuance
  const st={};order.forEach((k,i)=>st[k]=rolls[i]);
  Object.entries(R.b).forEach(([k,v])=>st[k]+=v);
  for(let i=0;i<(R.r||0);i++)st[keys[Math.floor(Math.random()*keys.length)]]+=1;
  keys.forEach(k=>st[k]=Math.max(3,Math.min(20,st[k])));
  const d6=()=>1+Math.floor(Math.random()*6);
  const pmMax=C.pm>0?Math.max(2,C.pm+2*mod(st[C.cast])):0;
  return {stats:st,pvMax:Math.max(1,C.hd+mod(st.con)),pmMax,ca:Math.max(8,10+C.ac+mod(st.dex)),or:(d6()+d6())*5};
}
function rollDraft(){
  if(!$('#n-name'))return;
  const g=genStats(readPick('n-race'),readPick('n-classe'));
  STATS.forEach(([k])=>{$('#n-st-'+k).value=g.stats[k]});$('#n-pv').value=g.pvMax;$('#n-pm').value=g.pmMax;$('#n-or').value=g.or;
}
const ETATS=['Empoisonné','Étourdi','Effrayé','À terre','Aveuglé','Épuisé','Béni','En feu'];
const SIZES=[15,16,17,19,21];
const SLOTS=[['tete','Tête'],['cou','Cou'],['torse','Torse'],['mains','Mains'],['main1','Main princ.'],['main2','Main second.'],['ceinture','Ceinture'],['jambes','Jambes'],['pieds','Pieds'],['anneau','Anneau']];
const STATS=[['str','Force','FOR'],['dex','Dextérité','DEX'],['con','Constitution','CON'],['int','Intelligence','INT'],['wis','Sagesse','SAG'],['cha','Charisme','CHA']];
const KINDS={quete:'Quête',pnj:'Personnage',lieu:'Lieu',note:'Note'};
const S={db:null,sample:null,dl:null,tab:'jeu',bType:'',bMin:1,bMax:10,bSort:'dg',camps:[],camp:null,combat:[],ini:{ordre:[],tour:0,round:0},dd:0,skOpen:false,target:null,adv:'n',atkEdit:false,combatOpen:false,foeForm:false,itemSel:null,creating:false,fs:+(store('fs')||2),pjs:[],bestiary:[],journal:[],msgs:[],meta:{},sel:null,busy:false,ctl:null,live:{},loaded:{},dbFail:false,diceOut:null,bfilter:'',jfilter:'all',speak:'pj'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mod=v=>Math.floor((Number(v||10)-10)/2);
const sgn=n=>(n>=0?'+':'')+n;
const uid=()=>Math.random().toString(36).slice(2,10);
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,3500)}
function store(k,v){try{if(v===undefined)return localStorage.getItem('gc_'+k);localStorage.setItem('gc_'+k,v)}catch(e){return null}}

/* ---------- écriture sérialisée ---------- */
let q=Promise.resolve();
function enqueue(fn){const p=q.then(fn,fn);q=p.catch(()=>{});return p}
function write(path,data,merge){
  if(!S.db){toast('Sauvegarde indisponible : connecte-toi à claude.ai.');return Promise.reject(new Error('nodb'))}
  return enqueue(()=>{const r=S.db.doc(path);return merge?r.update(data):r.set(data)}).catch(e=>{toast('Échec de la sauvegarde ('+(e.code||e.message)+')');throw e});
}
const del=path=>enqueue(()=>S.db.doc(path).delete()).catch(()=>toast('Suppression impossible.'));

/* ---------- accès aux données ---------- */
const curPj=()=>S.pjs.find(p=>p.id===S.sel)||S.pjs[0]||null;
function normPj(p){p.stats=p.stats||{};if(p.stats.vig!==undefined&&p.stats.str===undefined){const o=p.stats;p.stats={str:o.vig,dex:o.agi,con:o.vig,int:o.sav,wis:o.ins,cha:o.pre}}
  if(p.pmMax==null){p.pmMax=0;p.pm=0}
  STATS.forEach(([k])=>{if(p.stats[k]==null)p.stats[k]=10});p.inv=p.inv||[];p.equip=p.equip||{};p.etats=p.etats||[];p.atq=p.atq||[];p.atq.forEach(a=>{if(!a.id)a.id=uid()});p.mort=p.mort||{s:0,f:0};if(p.dv==null)p.dv=p.niveau||1;p.comp=p.comp||[];p.asi=p.asi||0;['race','classe','histo'].forEach(k=>{if(OLD[p[k]])p[k]=OLD[p[k]]});return p}
async function patchPj(id,fn){
  const p=S.pjs.find(x=>x.id===id);if(!p)throw new Error('Personnage introuvable : '+id);
  const c=normPj(JSON.parse(JSON.stringify(p)));fn(c);recalcCA(c);const {id:_,...data}=c;
  Object.assign(p,c);render('fiche',true);render('table');
  await write('pj/'+id,data);return c;
}
const party=()=>(S.meta.party||[]).map(id=>S.pjs.find(p=>p.id===id)).filter(Boolean);
const inParty=id=>(S.meta.party||[]).includes(id);
const cpath=(col,id)=>'campagnes/'+S.camp+'/'+col+'/'+id;
const writeMeta=patch=>{if(!S.camp){toast('Crée d’abord une campagne.');return Promise.reject(new Error('nocamp'))}Object.assign(S.meta,patch);return write('campagnes/'+S.camp,patch,true)};
function postMsg(m){if(!S.camp){toast('Aucune campagne en cours.');return Promise.resolve()}const t=Date.now();return write(cpath('table','m'+t+uid().slice(0,3)),{t,...m}).catch(()=>{})}
async function removePj(id){
  S.pjs=S.pjs.filter(x=>x.id!==id);if(S.sel===id)S.sel=(S.meta.party||[]).find(x=>x!==id)||(S.pjs[0]&&S.pjs[0].id)||null;
  await del('pj/'+id);for(const c of S.camps)if((c.party||[]).includes(id))await write('campagnes/'+c.id,{party:c.party.filter(x=>x!==id)},true).catch(()=>{});
  render('fiche',true);render('table');render('camps');head();
}
async function removeCamp(id){
  for(const col of ['table','journal']){const snap=await S.db.collection('campagnes/'+id+'/'+col).get();for(const d of snap.docs)await del('campagnes/'+id+'/'+col+'/'+d.id)}
  await del('campagnes/'+id+'/combat/etat');
  await del('campagnes/'+id);
}
async function maybeMigrate(){
  if(S.migrating||store('mig')==='1')return;S.migrating=true;
  try{const db=S.db;const [m,t,j]=await Promise.all([db.doc('meta/campagne').get(),db.collection('table').limit(500).get(),db.collection('journal').limit(500).get()]);
    if(m.exists||!t.empty||!j.empty){const id='c'+Date.now(),d=m.exists?m.data():{};
      await write('campagnes/'+id,{nom:d.nom||'Première campagne',ton:d.ton||'',monde:d.monde||'',resume:d.resume||'',resumeAt:d.resumeAt||0,mj:d.mj||'ia',party:S.pjs.map(p=>p.id),t:Date.now()});

/* ---------- dés ---------- */
function rollExpr(expr){
  const m=String(expr).replace(/\s+/g,'').toLowerCase().match(/^(\d{0,2})d(\d{1,3})([+-]\d+)?$/);
  if(!m)throw new Error('Expression invalide : '+expr+' (exemple : 2d6+3)');
  const n=Math.max(1,Math.min(50,+m[1]||1)),f=+m[2],b=+(m[3]||0);if(f<2)throw new Error('Dé invalide');
  const rs=Array.from({length:n},()=>1+Math.floor(Math.random()*f));
  return {expr:`${n}d${f}${b?sgn(b):''}`,rolls:rs,bonus:b,total:rs.reduce((a,c)=>a+c,0)+b,nat:(n===1&&f===20)?rs[0]:0,f};
}
const fmtRoll=r=>`[${r.rolls.join(', ')}]${r.bonus?' '+sgn(r.bonus):''} = ${r.total}`;
async function doRoll(expr,who,why,adv){
  let r;
  if(adv&&/^d20$|^1d20$/i.test(expr.replace(/\s/g,''))){
    const a=rollExpr('d20'),b=rollExpr('d20');const pick=adv==='av'?Math.max(a.total,b.total):Math.min(a.total,b.total);
    r={expr:'d20 '+(adv==='av'?'(avantage)':'(désavantage)'),rolls:[a.total,b.total],bonus:0,total:pick,nat:pick,f:20};
  } else r=rollExpr(expr);
  S.diceOut=r;rollFx(r);
  await postMsg({type:'roll',who:who||'Dés',total:r.total,nat:r.nat||0,text:`${r.expr} → ${fmtRoll(r)}${why?' · '+why:''}`});
  return r;
}

/* ---------- abonnements ---------- */
function watch(name,query,apply){
  const t=setTimeout(()=>{if(!S.loaded[name])toast('Le grimoire met du temps à répondre…')},10000);
  S.live[name]=query.onSnapshot(snap=>{
    clearTimeout(t);S.loaded[name]=true;apply(snap);
  },e=>{clearTimeout(t);S.dbFail=true;toast('Lecture impossible ('+(e.code||'?')+')');render('all')});
}
function selectCamp(id,silent){
  ['table','journal','combat'].forEach(n=>{if(S.live[n]){S.live[n]();delete S.live[n]}S.loaded[n]=false});
  S.camp=id;if(id)store('camp',id);S.msgs=[];S.journal=[];S.combat=[];S.ini={ordre:[],tour:0,round:0};S.target=null;S.combatOpen=false;
  const c=S.camps.find(x=>x.id===id);S.meta=c||{};
  if(id&&S.db){
    watch('table',S.db.collection('campagnes/'+id+'/table').orderBy('t','desc').limit(150),sn=>{if(S.camp!==id)return;S.msgs=sn.docs.map(d=>({id:d.id,...d.data()})).reverse();render('table')});
    watch('journal',S.db.collection('campagnes/'+id+'/journal').orderBy('t','desc').limit(300),sn=>{if(S.camp!==id)return;S.journal=sn.docs.map(d=>({id:d.id,...d.data()}));render('journal')});
    watch('combat',S.db.doc('campagnes/'+id+'/combat/etat'),sn=>{if(S.camp!==id)return;const dd=sn.exists?sn.data():{};S.combat=dd.liste||[];S.ini={ordre:dd.ordre||[],tour:dd.tour||0,round:dd.round||0};render('table');render('fiche')});
  }
  const pa=S.meta.party||[];if(pa.length&&!pa.includes(S.sel))S.sel=pa[0];
  head();if(!silent)render('all');
}
function setup(){
  const db=S.db;
  watch('pj',db.collection('pj'),s=>{S.pjs=s.docs.map(d=>normPj({id:d.id,...d.data()}));if(!S.sel||!S.pjs.some(p=>p.id===S.sel))S.sel=store('sel')&&S.pjs.some(p=>p.id===store('sel'))?store('sel'):(S.pjs[0]&&S.pjs[0].id);render('fiche');render('table');render('camps');head();if(S.loaded.campagnes&&!S.camps.length)maybeMigrate()});
  watch('bestiaire',db.collection('bestiaire'),s=>{S.bestiary=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.dg||0)-(b.dg||0)||String(a.nom).localeCompare(String(b.nom),'fr'));render('bestiaire')});
  watch('campagnes',db.collection('campagnes'),s=>{
    S.camps=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.t||0)-(a.t||0));
    const cur=S.camps.find(c=>c.id===S.camp);
    if(!cur){const st=store('camp');const pk=S.camps.find(c=>c.id===st)||S.camps[0];selectCamp(pk?pk.id:null,true)}else{S.meta=cur}
    if(!S.initTab){S.initTab=1;if(!S.hashAtLoad)show(S.camps.length?'jeu':'camps')}
    head();render('all');if(!S.camps.length&&S.loaded.pj)maybeMigrate()});
}

function head(){
  const el=$('#camp-line'),m=S.meta;
  if(!S.camps.length){el.textContent='Aucune campagne pour l’instant';return}
  el.innerHTML=`<select id="camp-sel" class="hsel" aria-label="Campagne en cours">${S.camps.map(c=>`<option value="${c.id}" ${c.id===S.camp?'selected':''}>${esc(c.nom||'Sans nom')}</option>`).join('')}</select> <span>· ${m.mj==='humain'?'MJ humain':'MJ Claude'} · ${party().length} héros</span>`;
}
function render(which,force){
  if(which==='all'){['camps','table','fiche','bestiaire','journal','monde'].forEach(k=>render(k));return}
  if(which==='des'){const r=$('#dres');if(r&&S.diceOut)r.textContent=S.diceOut.expr+' → '+fmtRoll(S.diceOut);return}
  if(which==='fiche'&&S.creating&&!force&&$('#n-name'))return;
  const inJeu=which==='table'||which==='fiche';
  if(inJeu?S.tab!=='jeu':which!==S.tab)return;
  const el=inJeu?$(which==='table'?'#right':'#left'):$('#p-'+which);if(!el)return;
  if(!force&&which!=='table'&&el.contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  ({camps:rCamps,table:rTable,fiche:rFiche,bestiaire:rBest,journal:rJournal,monde:rMonde})[which](el);
}
function tabs(){

function show(t){

async function shortRest(p){

function snd(k){

    const noise=(d,v,dl,hp)=>{dl=dl||0;const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++){SFX.seed=(SFX.seed*1664525+1013904223)%4294967296;a[i]=(SFX.seed/2147483648-1)*(1-i/n)}
      const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1500;const g=c.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t+dl)};

    else if(k==='hit'){tone(150,.2,'sawtooth',.28,0,55);noise(.09,.3,0,500)}
    else if(k==='crit'){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'square',.09,i*.08))}
    else if(k==='miss'){noise(.2,.1,0,3200)}

/* ---------- MJ Claude ---------- */
const logLine=x=>x.type==='mj'?`MJ : ${x.text}`:x.type==='sys'?`[système] ${x.text}`:`${x.who||'?'} : ${x.text}`;
function pjLine(p){return `${p.name} (${p.race||'?'} ${p.classe||'?'}, niv. ${p.niveau||1}) — PV ${p.pv}/${p.pvMax}${p.pmMax>0?`, PM ${p.pm}/${p.pmMax}`:''}, CA ${p.ca}, XP ${p.xp}, Or ${p.or}; `+STATS.map(([k,l])=>`${l} ${p.stats[k]} (${sgn(mod(p.stats[k]))})`).join(', ')+`; Équipé : ${SLOTS.map(([k,l])=>p.equip[k]?l+' '+p.equip[k]:'').filter(Boolean).join(', ')||'rien'}; États : ${p.etats.join(', ')||'aucun'}; Maîtrises : ${p.comp.join(', ')||'aucune'}; XP ${p.xp||0}/${nextXp(p.niveau)||'—'}; Attaques : ${p.atq.map(a=>`${a.nom} ${a.jet==='atk'?sgn(atkBonus(p,a))+' ':''}(${dmgLabel(p,a)}${a.pm?`, ${a.pm} PM`:''})`).join(', ')||'aucune'}; Inventaire : ${p.inv.map(i=>`${i.n}${(i.q||1)>1?' ×'+i.q:''}`).join(', ')||'vide'}`}
function buildPrompt(userText,pj){
  const m=S.meta,since=m.resumeAt||0;
  const recent=S.msgs.filter(x=>x.t>since&&x.type!=='ooc').slice(-30).map(logLine).join('\n');
  return `Tu es le Maître du Jeu d'un jeu de rôle fantasy, en français, joué sur une table partagée. Tu narres, tu incarnes les PNJ, tu arbitres.
RÈGLES DU JEU : d20 + modificateur de caractéristique contre un seuil (facile 8, moyen 12, difficile 16, héroïque 20). Les chiffres sont gérés à la main : tu ne dois JAMAIS les inventer ni les supposer. Les messages hors-jeu ne te sont pas transmis.
- Plusieurs héros peuvent jouer : le message indique lequel parle. Agis sur SON id pour ses jets et ses changements de fiche.
- Pour tout test de compétence ou jet de sauvegarde, appelle test_competence avec un DD réaliste (facile 10, moyen 15, difficile 20) : le moteur ajoute le bon bonus. Pour les autres jets (table aléatoire…), appelle lancer_des, puis narre selon le résultat.
- En combat, respecte l'ordre d'initiative : appelle initiative_lancer au début, puis tour_suivant quand l'acteur courant a fini. Un héros à 0 PV fait des jets de mort (géré par les joueurs).
- Quand un combat est gagné, tu peux accorder de l'XP supplémentaire avec xp_donner (l'XP des ennemis vaincus est distribuée par les joueurs).
- Pour changer PV, PV max, PM (points de mana, dépensés pour lancer des sorts), CA, XP ou Or, appelle modifier_pj (valeur absolue après changement).
- Pour donner ou retirer un objet, appelle inventaire.
- Quand une créature apparaît pour la première fois, appelle bestiaire_ajouter (si elle n'est pas déjà dans la liste ci-dessous).
- COMBAT : les attaques que les joueurs déclenchent avec les boutons sont déjà résolues par le moteur (lignes « Nom : d20 … » dans les échanges) : raconte le résultat sans relancer. Si un joueur décrit une attaque en texte, appelle attaque_pj. Pour les attaques des ennemis, appelle attaque_ennemi (jet, CA et dégâts sont gérés pour toi). N'utilise pas lancer_des pour une attaque.
- Quand un combat commence, enregistre les ennemis avec ennemi_ajouter (utilise bestiaire = nom d'une créature connue pour reprendre ses stats). Corrige avec ennemi_modifier, retire-les avec ennemi_retirer.
- Pour appliquer ou lever un état (Empoisonné, À terre…), appelle etat_pj.
- Pour équiper ou retirer un objet porté, appelle equiper.
- Pour noter une quête, un PNJ important ou un lieu, appelle journal_ajouter.
STYLE : 80 à 200 mots, immersif, sans méta-commentaire. Termine en laissant la main au joueur. Ne joue jamais à la place du joueur.
FORMAT : ta toute dernière ligne doit être exactement « ACTIONS: piste 1 | piste 2 | piste 3 » (3 idées d'action courtes, 8 mots max, à la première personne). Le joueur reste libre de faire autre chose.

CAMPAGNE : ${m.nom||'sans nom'} — ton : ${m.ton||'libre'}
MONDE : ${m.monde||'(non défini : improvise un monde cohérent et note les éléments clés dans le journal)'}
MÉMOIRE DES SESSIONS PASSÉES : ${m.resume||'(aucune)'}

PERSONNAGES DU GROUPE (id → fiche) :
${party().map(p=>`[${p.id}] ${pjLine(p)}`).join('\n')||'(aucun)'}

COMBAT EN COURS (id → ennemi) :
${S.combat.length?S.combat.map(foeLine).join('\n'):'(aucun ennemi enregistré)'}

INITIATIVE : ${S.ini.ordre.length?`round ${S.ini.round}, tour de ${activeActor().nom} — ordre : ${S.ini.ordre.map(c=>c.nom+' '+c.init).join(' › ')}`:'(non lancée)'}

BESTIAIRE DÉJÀ CONNU : ${S.bestiary.map(b=>b.nom).join(', ')||'(vide)'}

ÉCHANGES RÉCENTS :
${recent||'(début de l\'aventure)'}

NOUVEAU MESSAGE DU JOUEUR (il joue le personnage ${pj?pj.name+', id '+pj.id:'inconnu'}) :
${userText}`;
}
function tools(){
  const pjId={type:'string',description:'id du personnage, entre crochets dans la liste'};
  return [
   {name:'lancer_des',description:'Lance des dés et affiche le jet à la table. Retourne le détail et le total. Exemple d\'expression : d20+3, 2d6.',inputSchema:{type:'object',properties:{expression:{type:'string'},raison:{type:'string',description:'ex: Perception DD 12'}},required:['expression']},
    async execute(i){const r=await doRoll(String(i.expression),'Le MJ',i.raison?String(i.raison):'');return `Total ${r.total} (${fmtRoll(r)})`}},
   {name:'modifier_pj',description:'Définit un champ chiffré d\'un personnage. Champs : pv, pvMax, pm (mana), pmMax, ca, xp, or, niveau. Donne la NOUVELLE valeur absolue. Retourne la valeur enregistrée.',inputSchema:{type:'object',properties:{pj:pjId,champ:{type:'string',enum:['pv','pvMax','pm','pmMax','ca','xp','or','niveau']},valeur:{type:'number'}},required:['pj','champ','valeur']},
    async execute(i){const ch=String(i.champ);if(!['pv','pvMax','pm','pmMax','ca','xp','or','niveau'].includes(ch))throw new Error('champ inconnu');const v=Math.round(Number(i.valeur));if(!isFinite(v))throw new Error('valeur invalide');
      const c=await patchPj(String(i.pj),p=>{p[ch]=v});await postMsg({type:'sys',text:`${c.name} : ${ch} = ${v}`});return `${c.name} : ${ch} = ${c[ch]}`}},
   {name:'inventaire',description:'Ajoute ou retire un objet de l\'inventaire d\'un personnage.',inputSchema:{type:'object',properties:{pj:pjId,action:{type:'string',enum:['ajouter','retirer']},objet:{type:'string'},quantite:{type:'number'},note:{type:'string'}},required:['pj','action','objet']},
    async execute(i){const n=String(i.objet),qte=Math.max(1,Math.round(Number(i.quantite)||1));const add=i.action==='ajouter';
      const c=await patchPj(String(i.pj),p=>{const ex=p.inv.find(x=>x.n.toLowerCase()===n.toLowerCase());
        if(add){if(ex)ex.q=(ex.q||1)+qte;else p.inv.push({n,q:qte,note:i.note?String(i.note):''})}
        else if(ex){ex.q=(ex.q||1)-qte;if(ex.q<=0)p.inv=p.inv.filter(x=>x!==ex)}else throw new Error('objet absent de l\'inventaire')});
      await postMsg({type:'sys',text:`${c.name} ${add?'reçoit':'perd'} : ${n}${qte>1?' ×'+qte:''}`});return `${c.name} : ${c.inv.map(x=>x.n+(x.q>1?' ×'+x.q:'')).join(', ')||'vide'}`}},
   {name:'ennemi_ajouter',description:'Ajoute un ou plusieurs ennemis au combat en cours. Donne nom, ca, pv et attaque (ex : Griffes +4 (1d6+2)), ou bestiaire = nom exact d\'une créature connue pour reprendre ses stats. Retourne les ennemis créés avec leurs id.',inputSchema:{type:'object',properties:{nom:{type:'string'},bestiaire:{type:'string'},ca:{type:'number'},pv:{type:'number'},attaque:{type:'string'},quantite:{type:'number'}},required:['nom']},
    async execute(i){const bm=i.bestiaire?S.bestiary.find(b=>plain(b.nom)===plain(i.bestiaire)):null;const base=String(i.nom||(bm&&bm.nom)||'Ennemi');
      const n=await addFoes({base,ca:i.ca??(bm&&bm.ca)??10,pv:i.pv??(bm&&bm.pv)??10,att:String(i.attaque||(bm&&bm.att)||''),qty:i.quantite,dg:i.dg??(bm&&bm.dg),type:bm&&bm.type});return S.combat.slice(-n).map(foeLine).join('\n')}},
   {name:'ennemi_modifier',description:'Change les PV (valeur absolue) ou la CA d\'un ennemi du combat. Retourne son état.',inputSchema:{type:'object',properties:{ennemi:{type:'string',description:'id entre crochets'},pv:{type:'number'},ca:{type:'number'}},required:['ennemi']},
    async execute(i){const id=String(i.ennemi);if(!S.combat.some(e=>e.id===id))throw new Error('ennemi introuvable');
      await mutateCombat(l=>l.map(e=>e.id!==id?e:{...e,...(i.pv!=null?{pv:Math.max(0,Math.min(e.pvMax,Math.round(+i.pv))),ko:Math.round(+i.pv)<=0}:{}),...(i.ca!=null?{ca:Math.round(+i.ca)}:{})}));return foeLine(S.combat.find(e=>e.id===id))}},
   {name:'ennemi_retirer',description:'Retire un ennemi du combat (fuite, reddition) ou tous si id = tous.',inputSchema:{type:'object',properties:{ennemi:{type:'string'}},required:['ennemi']},
    async execute(i){const id=String(i.ennemi);await mutateCombat(l=>id==='tous'?[]:l.filter(e=>e.id!==id));return 'Retiré.'}},
   {name:'attaque_pj',description:'Résout l\'attaque d\'un héros avec le moteur de jeu : jet d20, comparaison à la CA, dégâts et PM appliqués automatiquement. attaque = nom de l\'attaque du héros (sinon la première). cible = id d\'un ennemi ou d\'un héros. avantage : a ou d.',inputSchema:{type:'object',properties:{pj:pjId,attaque:{type:'string'},cible:{type:'string'},avantage:{type:'string',enum:['a','d']}},required:['pj']},
    async execute(i){const pj=S.pjs.find(x=>x.id===String(i.pj));if(!pj)throw new Error('héros introuvable');const nm=plain(i.attaque);
      const a=(nm&&pj.atq.find(x=>plain(x.nom)===nm||plain(x.nom).includes(nm)))||pj.atq.find(x=>x.jet==='atk')||pj.atq[0];if(!a)throw new Error('ce héros n\'a aucune attaque');
      const tg=i.cible?targetById(String(i.cible)):null;if(i.cible&&!tg)throw new Error('cible introuvable');return await doAttack(pj,a,tg,i.avantage==='a'||i.avantage==='d'?i.avantage:'')}},
   {name:'attaque_ennemi',description:'Résout l\'attaque d\'un ennemi sur un héros : jet d20 contre sa CA, dégâts appliqués automatiquement. Utilise l\'attaque enregistrée de l\'ennemi, ou bonus et degats (ex : 2d6+1) pour la remplacer.',inputSchema:{type:'object',properties:{ennemi:{type:'string'},cible_pj:pjId,avantage:{type:'string',enum:['a','d']},bonus:{type:'number'},degats:{type:'string'}},required:['ennemi','cible_pj']},
    async execute(i){const e=S.combat.find(x=>x.id===String(i.ennemi));if(!e)throw new Error('ennemi introuvable');const pj=S.pjs.find(x=>x.id===String(i.cible_pj));if(!pj)throw new Error('héros introuvable');
      const m=i.degats?String(i.degats).replace(/\s/g,'').match(/^(\d+d\d+)([+-]\d+)?$/):null;
      return await enemyAttack(e,pj,{adv:i.avantage==='a'||i.avantage==='d'?i.avantage:'',bonus:i.bonus,...(m?{de:m[1],flat:+(m[2]||0)}:{})})}},
   {name:'initiative_lancer',description:'Lance l\'initiative (d20 + Dextérité) pour tous les héros du groupe et les ennemis vivants, et fixe l\'ordre. Retourne l\'ordre.',inputSchema:{type:'object',properties:{}},
    async execute(){return await rollInitiative()}},
   {name:'tour_suivant',description:'Passe au tour suivant dans l\'ordre d\'initiative (saute les ennemis vaincus). Retourne qui joue.',inputSchema:{type:'object',properties:{}},
    async execute(){return await nextTurn()}},
   {name:'test_competence',description:'Fait un test de compétence ou un jet de sauvegarde pour un héros, avec son vrai bonus (modificateur + maîtrise). competence = une compétence (Perception, Discrétion, Persuasion…) ou une caractéristique (FOR, DEX, CON, INT, SAG, CHA). dd = difficulté. avantage : a ou d.',inputSchema:{type:'object',properties:{pj:pjId,competence:{type:'string'},dd:{type:'number'},avantage:{type:'string',enum:['a','d']}},required:['pj','competence']},
    async execute(i){const pj=S.pjs.find(x=>x.id===String(i.pj));if(!pj)throw new Error('héros introuvable');const ck=findCheck(i.competence);if(!ck)throw new Error('compétence inconnue : '+i.competence);
      const bonus=ck.skill?skillBonus(pj,ck.skill):mod(pj.stats[ck.stat]);const lab=ck.skill?`${ck.label} (${STATS.find(x=>x[0]===ck.stat)[2]})`:ck.label;
      return await doCheck(pj,lab,bonus,+i.dd||0,i.avantage==='a'||i.avantage==='d'?i.avantage:'')}},
   {name:'xp_donner',description:'Accorde de l\'XP supplémentaire (récompense de quête, bonne idée…). Si pj est omis, chaque héros du groupe reçoit le montant.',inputSchema:{type:'object',properties:{montant:{type:'number'},pj:{type:'string'}},required:['montant']},
    async execute(i){const n=Math.round(+i.montant);if(!(n>0))throw new Error('montant invalide');const list=i.pj?S.pjs.filter(x=>x.id===String(i.pj)):party();if(!list.length)throw new Error('aucun héros');
      for(const p of list)await patchPj(p.id,x=>{x.xp=(x.xp||0)+n});const txt=`${list.map(p=>p.name).join(', ')} : +${n} XP`;await postMsg({type:'sys',text:txt});return txt}},
   {name:'etat_pj',description:'Applique ou retire un état à un personnage (ex : Empoisonné, À terre, Béni, ou un état libre).',inputSchema:{type:'object',properties:{pj:pjId,etat:{type:'string'},actif:{type:'boolean'}},required:['pj','etat','actif']},
    async execute(i){const e=String(i.etat).trim();if(!e)throw new Error('état vide');const c=await patchPj(String(i.pj),p=>{p.etats=p.etats.filter(x=>x!==e);if(i.actif)p.etats.push(e)});
      await postMsg({type:'sys',text:`${c.name} : ${e} ${i.actif?'appliqué':'levé'}`});return `${c.name} : ${c.etats.join(', ')||'aucun état'}`}},
   {name:'equiper',description:'Équipe un objet de l\'inventaire dans un emplacement (objet vide pour retirer). Emplacements : tete, cou, torse, mains, main1, main2, ceinture, jambes, pieds, anneau.',inputSchema:{type:'object',properties:{pj:pjId,emplacement:{type:'string',enum:SLOTS.map(x=>x[0])},objet:{type:'string'}},required:['pj','emplacement','objet']},
    async execute(i){const k=String(i.emplacement);if(!SLOTS.some(x=>x[0]===k))throw new Error('emplacement inconnu');const o=String(i.objet||'');
      const c=await patchPj(String(i.pj),p=>{p.equip[k]=o});return `${c.name} : ${k} = ${o||'vide'}`}},
   {name:'bestiaire_ajouter',description:'Ajoute une créature au Monstropedia si son nom n\'y figure pas déjà. dg = danger de 1 à 10.',inputSchema:{type:'object',properties:{nom:{type:'string'},type:{type:'string'},dg:{type:'number'},pv:{type:'number'},ca:{type:'number'},att:{type:'string'},desc:{type:'string'},capacites:{type:'string'},butin:{type:'string'},habitat:{type:'string'}},required:['nom','desc']},
    async execute(i){const nom=String(i.nom);if(S.bestiary.some(b=>String(b.nom).toLowerCase()===nom.toLowerCase()))return 'Déjà connue.';
      const data={nom,type:String(i.type||''),dg:Number(i.dg)||1,pv:Number(i.pv)||0,ca:Number(i.ca)||10,att:String(i.att||''),desc:String(i.desc||''),capacites:String(i.capacites||''),butin:String(i.butin||''),habitat:String(i.habitat||'')};
      const id='b'+Date.now()+uid().slice(0,3);S.bestiary.push({id,...data});await write('bestiaire/'+id,data);return 'Ajoutée.'}},
   {name:'journal_ajouter',description:'Ajoute une entrée au journal de campagne. kind : quete, pnj, lieu ou note.',inputSchema:{type:'object',properties:{kind:{type:'string',enum:['quete','pnj','lieu','note']},titre:{type:'string'},texte:{type:'string'}},required:['kind','titre','texte']},
    async execute(i){const kind=KINDS[i.kind]?String(i.kind):'note';await write(cpath('journal','j'+Date.now()+uid().slice(0,3)),{t:Date.now(),kind,titre:String(i.titre),texte:String(i.texte)});return 'Noté.'}}
  ];
}
const ERR={not_granted:'Tu as refusé l’accès à Claude. Recharge la page pour réessayer, ou passe en MJ humain.',rate_limited:'Trop d’appels ou limite d’usage atteinte. Patiente un peu avant de renvoyer.',session_expired:'Session expirée : reconnecte-toi à claude.ai.',sampling_disabled:'Claude n’est pas disponible pour ce compte.',upstream_error:'Le MJ a eu un souci de connexion. Réessaie.',refused:'Le MJ a refusé de répondre à ce message. Reformule.',empty_completion:'Le MJ n’a rien écrit. Reformule ou réessaie.',prompt_too_large:'La mémoire est trop longue : utilise « Condenser la mémoire ».'};
async function ask(userText,pj){
  if(!S.sample){toast('Claude indisponible ici : passe en MJ humain.');return}
  S.busy=true;S.ctl=new AbortController();render('table');
  try{
    const r=await S.sample(buildPrompt(userText,pj),{signal:S.ctl.signal,cache:false,tools:tools(),
      onText:()=>{const t=$('#think');if(t)t.textContent='Le MJ écrit…'}});
    let body=r.text.trim(),sugg=[];const mm=body.match(/\n?[ \t]*\**ACTIONS\**\s*:\s*(.+?)\s*$/i);
    if(mm){sugg=mm[1].split('|').map(x=>x.replace(/^[\s*"«-]+|[\s*"»]+$/g,'')).filter(Boolean).slice(0,4);body=body.slice(0,mm.index).trim()}
    await postMsg({type:'mj',mode:'ia',text:body,sugg});
    if(r.truncated)toast('Réponse tronquée : demande la suite.');
  }catch(e){
    if(e&&e.code!=='cancelled')toast(ERR[e&&e.code]||'Erreur du MJ ('+(e&&e.code||e&&e.message)+')');
    if(e&&e.text&&e.code!=='cancelled'&&e.code!=='refused')await postMsg({type:'mj',mode:'ia',text:e.text.trim()+' […]'});
  }finally{S.busy=false;S.ctl=null;render('table')}
}
async function condense(){
  if(!S.sample)return toast('Claude indisponible ici.');
  S.busy=true;render('table');
  try{
    const log=S.msgs.filter(x=>x.t>(S.meta.resumeAt||0)&&x.type!=='ooc').map(logLine).join('\n').slice(-60000);
    const {text}=await S.sample(`Tu tiens la mémoire d'une campagne de jeu de rôle. Réécris un résumé unique, en français, de 150 à 300 mots : faits importants, lieux, PNJ et leur attitude, quêtes en cours, promesses, dettes, ennemis. Sans les chiffres de fiche.\n\nRÉSUMÉ ACTUEL :\n${S.meta.resume||'(aucun)'}\n\nNOUVEAUX ÉVÉNEMENTS :\n${log}`,{cache:false,modelTier:'default'});
    await writeMeta({resume:text.trim(),resumeAt:Date.now()});toast('Mémoire mise à jour.');
  }catch(e){if(e&&e.code!=='cancelled')toast(ERR[e&&e.code]||'Résumé impossible.')}
  finally{S.busy=false;render('table')}
}
async function genWorld(){
  if(!S.sample)return;S.busy=true;render('monde');
  try{
    const o=await S.sample.json(`Invente un monde de fantasy original (pas de licence existante) pour un jeu de rôle. Réponds uniquement par un objet JSON : {"nom":"nom de la campagne","ton":"3 mots","monde":"250 à 350 mots en français : géographie, 3 factions, un danger qui monte, 3 lieux marquants, un point de départ pour les héros"}.`,{cache:false});
    await writeMeta({nom:String(o.nom||''),ton:String(o.ton||''),monde:String(o.monde||'')});toast('Monde créé.');
  }catch(e){toast(ERR[e&&e.code]||'Génération impossible.')}
  finally{S.busy=false;render('monde')}
}

/* ---------- événements ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.tab)return show(t.dataset.tab);
  if(t.dataset.iv!=null){S.itemSel=S.itemSel===+t.dataset.iv?null:+t.dataset.iv;render('fiche',true);return}
  if(t.dataset.snd!==undefined){SFX.on=!SFX.on;store('snd',SFX.on?'1':'0');tabs();snd('turn');return}
  if(t.dataset.asi){const pp=curPj();const k=t.dataset.asi;if(pp)patchPj(pp.id,c=>{if(c.asi>0&&c.stats[k]<20){c.stats[k]++;c.asi--}}).catch(()=>{});return}
  if(t.dataset.chk){const pp=curPj();const sk=SKILLS.find(x=>x[0]===t.dataset.chk);if(pp&&sk){S.skOpen=true;const adv=S.adv==='n'?'':S.adv;S.adv='n';await doCheck(pp,`${sk[0]} (${STATS.find(x=>x[0]===sk[1])[2]})`,skillBonus(pp,sk),S.dd,adv);render('fiche',true)}return}
  if(t.dataset.fs){S.fs=Math.max(0,Math.min(SIZES.length-1,S.fs+ +t.dataset.fs));store('fs',String(S.fs));applyFs();return}
  if(t.dataset.sugg){const b=$('#say');if(b){b.value=t.dataset.sugg;b.focus()}return}
  if(t.dataset.etat){const pp=curPj();if(pp){const e=t.dataset.etat;patchPj(pp.id,c=>{c.etats=c.etats.includes(e)?c.etats.filter(x=>x!==e):[...c.etats,e]}).catch(()=>{})}return}
  if(t.dataset.pane){setPane(t.dataset.pane);return}
  if(t.dataset.roll){const p=curPj();return void doRoll(t.dataset.roll,p?p.name:'Joueur',t.dataset.why||'').then(()=>render('des')).catch(e=>toast(e.message))}
  if(t.dataset.step){const p=curPj();if(!p)return;const k=t.dataset.step,d=+t.dataset.d;
    return void patchPj(p.id,c=>{c[k]=(Number(c[k])||0)+d;if(k==='pv'||k==='pvMax')c.pv=Math.max(0,c.pv);if(k==='pm'||k==='pmMax')c.pm=Math.max(0,c.pm||0)}).catch(()=>{})}
  if(t.dataset.atk){const pp=curPj();if(!pp)return;const at=attackById(pp,t.dataset.atk);if(!at)return;const adv=S.adv==='n'?'':S.adv;S.adv='n';await doAttack(pp,at,getTarget(),adv);render('fiche',true);return}
  if(t.dataset.adv){S.adv=t.dataset.adv;render('fiche',true);return}
  const a=t.dataset.act;if(!a)return;
  const p=curPj();
  switch(a){
   case 'send':{const box=$('#say');const txt=box.value.trim();if(!txt||S.busy)return;box.value='';
     const rm=txt.match(/^\/(?:r|roll|jet)\s+(.+)$/i);
     if(rm){doRoll(rm[1],p?p.name:'Joueur').catch(e=>toast(e.message));break}
     if(S.speak==='ooc'){await postMsg({type:'ooc',who:p?p.name:'Joueur',text:txt});break}
     const asMj=S.speak==='mj';
     if(asMj){await postMsg({type:'mj',mode:'humain',text:txt});break}
     if(S.camp&&p&&!inParty(p.id))writeMeta({party:[...(S.meta.party||[]),p.id]}).then(()=>{head()}).catch(()=>{});
     await postMsg({type:'joueur',who:p?p.name:'Joueur',text:txt});
     if(S.meta.mj!=='humain')ask(txt,p);break}
   case 'dmg':case 'heal':{const n=Math.abs(+t.dataset.n||0);if(!p||!n)return;
     await patchPj(p.id,c=>{const mx=c.pvMax>0?c.pvMax:Infinity;c.pv=Math.max(0,Math.min(mx,c.pv+(a==='dmg'?-n:n)))}).catch(()=>{});
     await postMsg({type:'sys',text:`${p.name} ${a==='dmg'?'perd':'récupère'} ${n} PV`});break}
   case 'regen':{if(S.busy)return;const idx=S.msgs.map(m=>m.type).lastIndexOf('joueur');if(idx<0)return;const last=S.msgs[idx];
     const old=S.msgs.slice(idx+1).filter(m=>m.type==='mj'&&m.mode==='ia');for(const m of old)await del(cpath('table',m.id));
     S.msgs=S.msgs.filter(m=>!old.includes(m));toast('Les changements de fiche déjà faits par le MJ restent.');ask(last.text,S.pjs.find(x=>x.name===last.who)||p);break}
   case 'undo':{const m=S.msgs[S.msgs.length-1];if(m&&!S.busy){S.msgs.pop();render('table');await del(cpath('table',m.id))}break}
   case 'rolldraft':rollDraft();break;
   case 'rerollpj':{if(!p)return;if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Confirmer : remplace stats, PV et CA';return}
     const g=genStats(p.race,p.classe);await patchPj(p.id,c=>{c.stats=g.stats;c.pvMax=g.pvMax;c.pv=g.pvMax;c.pmMax=g.pmMax;c.pm=g.pmMax;c.ca=g.ca}).catch(()=>{});toast('Nouveau tirage appliqué.');break}
   case 'party':{if(!p||!S.camp)return;const pa=S.meta.party||[];await writeMeta({party:pa.includes(p.id)?pa.filter(x=>x!==p.id):[...pa,p.id]}).catch(()=>{});head();render('fiche',true);render('table');break}
   case 'playcamp':selectCamp(t.dataset.id);show('jeu');break;
   case 'createcamp':{const nom=$('#nc-nom').value.trim();if(!nom)return toast('Donne un nom à la campagne.');
     const ids=[...document.querySelectorAll('.nc-p:checked')].map(x=>x.value);const id='c'+Date.now();
     const d={nom,ton:$('#nc-ton').value.trim(),monde:'',resume:'',resumeAt:0,mj:'ia',party:ids,t:Date.now()};
     S.camps=[{id,...d},...S.camps];await write('campagnes/'+id,d).catch(()=>{});selectCamp(id);show('monde');toast('Campagne créée. Décris le monde ou laisse Claude l’inventer.');break}
   case 'delcamp':if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Confirmer (efface tout)';return}
     await removeCamp(t.dataset.id);break;
   case 'openpj':S.sel=t.dataset.id;S.creating=false;store('sel',S.sel);setPane('fiche');show('jeu');break;
   case 'newpjr':S.creating=true;S.createAdd=false;setPane('fiche');show('jeu');break;
   case 'delpjr':if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Confirmer';return}
     await removePj(t.dataset.id);break;
   case 'atkedit':S.atkEdit=!S.atkEdit;render('fiche',true);break;
   case 'addatk':if(p)patchPj(p.id,c=>c.atq.push({id:uid(),nom:'Nouvelle attaque',kind:'arme',stat:'str',de:'1d6',bonus:0,pm:0,jet:'atk'})).catch(()=>{});break;
   case 'delatk':if(p)patchPj(p.id,c=>{c.atq=c.atq.filter(x=>x.id!==t.dataset.id)}).catch(()=>{});break;
   case 'kit':if(p){if(p.atq.length&&t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Confirmer : remplace tout';return}patchPj(p.id,c=>{c.atq=kitAttacks(c)}).catch(()=>{})}break;
   case 'foeopen':S.combatOpen=true;render('table');break;
   case 'foeadd':S.combatOpen=true;S.foeForm=true;render('table');break;
   case 'foecancel':S.foeForm=false;render('table');break;
   case 'foeclose':S.combatOpen=false;S.foeForm=false;render('table');break;
   case 'foesave':{const bm=S.bestiary.find(x=>x.id===$('#foe-b').value);const nom=bm?bm.nom:$('#foe-n').value.trim();if(!nom)return toast('Donne un nom à l’ennemi.');
     await addFoes({base:nom,ca:bm?bm.ca:$('#foe-ca').value,pv:bm?bm.pv:$('#foe-pv').value,att:bm?bm.att:$('#foe-att').value.trim(),qty:$('#foe-q').value,dg:bm?bm.dg:1,type:bm?bm.type:''});S.foeForm=false;render('table');break}
   case 'foetgt':S.target={k:'enemy',id:t.dataset.id};render('table');render('fiche',true);break;
   case 'foeatk':{const e=S.combat.find(x=>x.id===t.dataset.id);if(e&&p){const adv=S.adv==='n'?'':S.adv;S.adv='n';await enemyAttack(e,p,{adv});render('fiche',true)}break}
   case 'foedel':await mutateCombat(l=>l.filter(e=>e.id!==t.dataset.id));break;
   case 'foehp':await mutateCombat(l=>l.map(e=>{if(e.id!==t.dataset.id)return e;const pv=Math.max(0,Math.min(e.pvMax,e.pv+(+t.dataset.d)));return {...e,pv,ko:pv<=0}}));break;
   case 'foeclear':if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Confirmer';return}
     S.ini={ordre:[],tour:0,round:0};await mutateCombat(()=>[]);S.combatOpen=false;if(S.target&&S.target.k==='enemy')S.target=null;render('fiche',true);break;
   case 'applyd':{const tg=targetById(t.dataset.tid);const n=+t.dataset.n;const v=t.dataset.half==='1'?Math.floor(n/2):n;if(tg)await hurt(tg,v);break}
   case 'narrate':if(!S.busy)ask('(Les jets ci-dessus viennent d’être résolus par le moteur de jeu. Raconte le résultat de façon immersive et fais avancer la scène. Ne relance rien.)',p);break;
   case 'rollini':await rollInitiative();break;
   case 'nextturn':await nextTurn();break;
   case 'givexp':await giveXp();break;
   case 'levelup':if(p)await levelUp(p);break;
   case 'dsave':if(p)await deathSave(p);break;
   case 'srest':if(p)await shortRest(p);break;
   case 'lrest':if(p)await longRest(p);break;
   case 'caauto':if(p)patchPj(p.id,c=>{c.caAuto=!c.caAuto}).catch(()=>{});break;
   case 'useitem':{const i=+t.dataset.i;if(!p||!p.inv[i])return;const it=p.inv[i];const h=rollExpr('2d4+2');await patchPj(p.id,c=>{c.inv[i].q=(c.inv[i].q||1)-1;if(c.inv[i].q<=0){c.inv.splice(i,1);S.itemSel=null}});await hurt({k:'pj',id:p.id,name:p.name},-h.total);await postMsg({type:'sys',text:`${p.name} utilise ${it.n} : 2d4+2 [${h.rolls.join(', ')}] = +${h.total} PV`});break}
   case 'encgen':{S.encD=$('#enc-d').value;S.enc=genEncounter(S.encD);if(!S.enc)toast('Impossible de composer une rencontre : ajoute des héros au groupe ou des créatures au bestiaire.');render('table');break}
   case 'encgo':if(S.enc){const e=S.enc;S.enc=null;S.foeForm=false;for(const x of e.list)await addFoes({base:x.b.nom,ca:x.b.ca,pv:x.b.pv,att:x.b.att,qty:x.n,dg:x.b.dg,type:x.b.type});await rollInitiative()}break;
   case 'tofight':{const bm=S.bestiary.find(x=>x.id===t.dataset.id);if(!bm)return;if(!S.camp)return toast('Crée d’abord une campagne.');await addFoes({base:bm.nom,ca:bm.ca,pv:bm.pv,att:bm.att,qty:1,dg:bm.dg,type:bm.type});S.combatOpen=true;toast(bm.nom+' ajouté au combat.');break}
   case 'lootmon':{const bm=S.bestiary.find(x=>x.id===t.dataset.id);if(bm)await lootRoll(bm);break}
   case 'foeloot':{const e=S.combat.find(x=>x.id===t.dataset.id);if(!e)return;const bm=S.bestiary.find(x=>plain(x.nom)===plain(e.base))||{nom:e.nom,dg:e.dg,butin:''};await mutateCombat(l=>l.map(x=>x.id===e.id?{...x,looted:true}:x));await lootRoll({...bm,nom:e.nom});break}
   case 'jnote':{const m=S.msgs.find(x=>x.id===t.dataset.mid);if(!m)return;const titre=m.text.replace(/\s+/g,' ').slice(0,48)+(m.text.length>48?'…':'');
     await write(cpath('journal','j'+Date.now()+uid().slice(0,3)),{t:Date.now(),kind:'note',titre,texte:m.text}).catch(()=>{});toast('Ajouté au journal.');break}
   case 'fullkit':if(p)await fullKit(p);break;
   case 'stop':if(S.ctl)S.ctl.abort();break;
   case 'condense':condense();break;
   case 'newpj':S.creating=true;S.createAdd=true;render('fiche',true);break;
   case 'cancelpj':S.creating=false;render('fiche',true);break;
   case 'createpj':{const name=$('#n-name').value.trim();if(!name)return toast('Donne un nom au personnage.');
     const id='p'+Date.now();const gv=(id,dflt)=>{const n=parseInt($('#'+id).value,10);return Number.isFinite(n)?n:dflt};
     const d={name,race:readPick('n-race'),classe:readPick('n-classe'),histo:readPick('n-histo'),equip:{},niveau:1,xp:0,pv:gv('n-pv',10),pvMax:gv('n-pv',10),pm:gv('n-pm',0),pmMax:gv('n-pm',0),or:gv('n-or',0),stats:Object.fromEntries(STATS.map(([k])=>[k,gv('n-st-'+k,10)])),inv:[],notes:'',atq:[]};d.atq=kitAttacks(d);{const kg=kitGear(d);d.inv=kg.inv;d.equip=kg.equip}d.comp=pickN(CLASS_SKILLS[classKey(d.classe)]||SKILLS.map(x=>x[0]),3);d.dv=1;d.caAuto=true;d.ca=calcCA(d);
     S.pjs.push({id,...d});S.sel=id;S.creating=false;store('sel',id);await write('pj/'+id,d).catch(()=>{});if(S.camp&&S.createAdd)await writeMeta({party:[...(S.meta.party||[]),id]}).catch(()=>{});S.createAdd=false;head();render('fiche',true);render('table');render('camps');break}
   case 'delpj':if(p&&t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Confirmer la suppression';return}
     if(p)await removePj(p.id);break;
   case 'addinv':{const v=$('#new-it').value.trim();if(v&&p){S.itemSel=p.inv.length;patchPj(p.id,c=>c.inv.push({n:v,q:1,note:''}))}break}
   case 'delinv':if(p){S.itemSel=null;patchPj(p.id,c=>c.inv.splice(+t.dataset.i,1))}break;
   case 'rollx':doRoll($('#expr').value,p?p.name:'Joueur').then(()=>render('des')).catch(e=>toast(e.message));break;
   case 'rolladv':doRoll('d20',p?p.name:'Joueur','','av').then(()=>render('des'));break;
   case 'rolldis':doRoll('d20',p?p.name:'Joueur','','dis').then(()=>render('des'));break;
   case 'newmon':monForm();break;
   case 'editmon':monForm(S.bestiary.find(b=>b.id===t.dataset.id));break;
   case 'cancelmon':$('#monform').innerHTML='';break;
   case 'delmon':if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Confirmer';return}
     S.bestiary=S.bestiary.filter(b=>b.id!==t.dataset.id);await del('bestiaire/'+t.dataset.id);render('bestiaire');break;
   case 'savemon':{const g=k=>$('#m-'+k).value.trim();if(!g('nom'))return toast('Le nom est obligatoire.');
     const id=g('id')||('b'+Date.now());const d={nom:g('nom'),type:g('type'),habitat:g('habitat'),dg:+g('dg')||1,pv:+g('pv')||0,ca:+g('ca')||10,att:g('att'),desc:g('desc'),capacites:g('capacites'),faiblesse:g('faiblesse'),butin:g('butin')};
     await write('bestiaire/'+id,d).catch(()=>{});$('#monform').innerHTML='';break}
   case 'addj':{const ti=$('#j-titre').value.trim();if(!ti)return toast('Ajoute un titre.');
     await write(cpath('journal','j'+Date.now()),{t:Date.now(),kind:$('#j-kind').value,titre:ti,texte:$('#j-texte').value.trim()}).catch(()=>{});break}
   case 'delj':await del(cpath('journal',t.dataset.id));break;
   case 'savemonde':await writeMeta({nom:$('#c-nom').value.trim(),ton:$('#c-ton').value.trim(),monde:$('#c-monde').value.trim(),resume:$('#c-resume').value.trim()}).then(()=>{toast('Monde enregistré.');head()}).catch(()=>{});break;
   case 'genmonde':genWorld();break;
   case 'export':{const data=JSON.stringify({campagnes:S.camps,campagne_en_cours:S.camp,personnages:S.pjs,bestiaire:S.bestiary,journal:S.journal,table:S.msgs},null,1);
     try{await S.dl.save({filename:'grimoire-sauvegarde.json',data})}catch(e){if(e&&e.code!=='declined')toast('Export impossible.')}break}
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target,p=curPj();
  if(t.classList.contains('pick')){
    const o=t.parentElement.querySelector('input');const other=t.value==='__autre';o.hidden=!other;
    if(other){o.focus();return}
    if(t.dataset.pk&&p)patchPj(p.id,c=>{c[t.dataset.pk]=t.value}).catch(()=>{});
    else if(/^n-(race|classe)-s$/.test(t.id))rollDraft();
    return}
  if(/^n-(race|classe)-o$/.test(t.id)){rollDraft();return}
  if(t.dataset.eq&&p){patchPj(p.id,c=>{c.equip[t.dataset.eq]=t.value}).catch(()=>{});return}
  if(t.id==='pj-sel'){S.sel=t.value;S.creating=false;store('sel',t.value);render('fiche',true);render('table');return}
  if(t.id==='who'){S.speak=t.value;return}
  if(t.id==='camp-sel'){selectCamp(t.value);return}
  if(t.classList.contains('mp')){const pa=new Set(S.meta.party||[]);t.checked?pa.add(t.value):pa.delete(t.value);writeMeta({party:[...pa]}).then(()=>{head();render('table')}).catch(()=>{});return}
  if(t.id==='mode'){writeMeta({mj:t.value}).catch(()=>{});return}
  if(t.id==='bt'){S.bType=t.value;render('bestiaire',true);return}
  if(t.id==='bmin'){S.bMin=+t.value;if(S.bMax<S.bMin)S.bMax=S.bMin;render('bestiaire',true);return}
  if(t.id==='bmax'){S.bMax=+t.value;if(S.bMin>S.bMax)S.bMin=S.bMax;render('bestiaire',true);return}
  if(t.id==='bs'){S.bSort=t.value;render('bestiaire',true);return}
  if(t.id==='jf'){S.jfilter=t.value;render('journal');return}
  if(t.id==='tgt'){const v=t.value;S.target=!v?null:v==='ca'?{k:'ca',ca:(S.target&&S.target.ca)||0}:v.startsWith('e:')?{k:'enemy',id:v.slice(2)}:{k:'pj',id:v.slice(2)};render('fiche',true);return}
  if(t.id==='dd'){S.dd=+t.value||0;return}
  if(t.dataset.comp&&p){const n=t.dataset.comp;patchPj(p.id,c=>{c.comp=c.comp.includes(n)?c.comp.filter(x=>x!==n):[...c.comp,n]}).catch(()=>{});return}
  if(t.id==='tgca'){S.target={k:'ca',ca:+t.value||0};return}
  if(t.dataset.aedit&&p){const id=t.dataset.aedit,k=t.dataset.k;patchPj(p.id,c=>{const at=c.atq.find(x=>x.id===id);if(at)at[k]=(k==='bonus'||k==='pm')?(Number(t.value)||0):t.value}).catch(()=>{});return}
  if((t.id==='add-w'||t.id==='add-s')&&p&&t.value){const nm=t.value;patchPj(p.id,c=>c.atq.push(mkAttack(c,nm))).catch(()=>{});return}
  if(!p)return;
  if(t.dataset.f){const k=t.dataset.f;patchPj(p.id,c=>{c[k]=t.type==='number'?(Number(t.value)||0):t.value}).catch(()=>{});return}
  if(t.dataset.s){patchPj(p.id,c=>{c.stats[t.dataset.s]=Number(t.value)||10}).catch(()=>{});return}
  if(t.dataset.inv!=null){const i=+t.dataset.inv,k=t.dataset.k;patchPj(p.id,c=>{if(c.inv[i])c.inv[i][k]=k==='q'?(Number(t.value)||1):t.value}).catch(()=>{})}
});
document.addEventListener('input',ev=>{if(ev.target.id==='bf'){S.bfilter=ev.target.value;const pos=ev.target.selectionStart;S.tab==='bestiaire'&&(()=>{const el=$('#p-bestiaire');const b=ev.target;
  const list=S.bestiary;/* rendu complet en conservant le focus */ el.dataset.skip='';const val=b.value;rBest(el);const n=$('#bf');n.focus();n.setSelectionRange(pos,pos)})()}});
document.addEventListener('keydown',ev=>{
  if(ev.target.id==='say'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();document.querySelector('[data-act="send"]').click()}
  if(ev.target.id==='dpv'&&ev.key==='Enter'){const v=ev.target.value.replace(/[−–]/g,'-').replace(/\s/g,'');const m=v.match(/^([+-])(\d+)$/),pp=curPj();
    if(!m||!pp){toast('Écris par exemple -5 (dégâts) ou +3 (soin).');return}
    const n=(m[1]==='-'?-1:1)*+m[2];ev.target.value='';
    patchPj(pp.id,c=>{const mx=c.pvMax>0?c.pvMax:Infinity;c.pv=Math.max(0,Math.min(mx,c.pv+n))}).then(()=>postMsg({type:'sys',text:`${pp.name} ${n<0?'perd':'récupère'} ${Math.abs(n)} PV`})).catch(()=>{})}
  if(ev.target.id==='expr'&&ev.key==='Enter'){document.querySelector('[data-act="rollx"]').click()}
});

document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('skills'))S.skOpen=e.target.open},true);
document.addEventListener('keydown',ev=>{
  if(/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName||'')||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  if(S.tab==='jeu'&&/^[1-9]$/.test(ev.key)){const b=document.querySelectorAll('.atk')[+ev.key-1];if(b){ev.preventDefault();b.click()}}
  else if(S.tab==='jeu'&&(ev.key==='n'||ev.key==='N')){const b=document.querySelector('[data-act="nextturn"]');if(b)b.click()}
  else if(ev.key==='/'){const x=$('#say');if(x){ev.preventDefault();x.focus()}}
  else if(ev.key==='Escape'){if(S.foeForm){S.foeForm=false;render('table')}else if(S.atkEdit){S.atkEdit=false;render('fiche',true)}}
});
/* ---------- démarrage ---------- */
async function boot(){
  const h=(location.hash||'').replace('#','');S.hashAtLoad=TABS.some(([k])=>k===h)?h:'';
  applyFs();tabs();show(TABS.some(([k])=>k===h)?h:'jeu');S.initTab=TABS.some(([k])=>k===h)?1:0;
  window.addEventListener('hashchange',()=>{const x=location.hash.replace('#','');if(TABS.some(([k])=>k===x)&&x!==S.tab)show(x)});
  const c=window.claude;
  if(!c||!c.use){$('#right').innerHTML=noDb();return}
  const [db,sample,dl]=await Promise.all([c.use('db').catch(()=>null),c.use('sample').catch(()=>null),c.use('downloads').catch(()=>null)]);
  S.db=db;S.sample=sample;S.dl=dl;
  if(!db){render('all');return}
  setup();render('all');
}
boot();
})();
</script>
